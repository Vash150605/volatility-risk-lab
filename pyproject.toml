[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "volrisk"
version = "0.1.0"
description = "Volatility & Risk Lab: GARCH MLE, VaR/ES Backtests, and MCMC CAPM Beta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "arch",
    "matplotlib",
    "pytest",
    "pyarrow",
    "yfinance",
]

[tool.setuptools.packages.find]
where = ["src"]